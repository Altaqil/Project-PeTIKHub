<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminHMD authentication page">
  <title>Login</title>

  <link rel="stylesheet" href="Template/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="Template/assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="Template/assets/css/style.css">
</head>

<body class="auth-body">

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-md-10 col-lg-9 col-xl-8">
        <!-- Login Form Card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <div class="row g-0">
            <!-- KIRI: Gambar memenuhi kolom -->
            <div class="col-12 col-md-5 position-relative" style="min-height: 220px;">
              <img src="Template/assets/images/jpeg/banner-login.jpeg" alt="Logo PETIK"
                class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
            </div>

            <div class="col-12 col-md-7">
              <div class="card-body p-4 p-md-5">
                <div class=" text-center pb-5">
                  <img src="Template/assets/images/jpeg/ptik.png" alt="" style="height: 7rem; width: 6rem;">
                </div>
                <form id="loginForm" novalidate>
                  <h1 class="fw-bold text-center h3">Selamat datang di PeTIKHub</h1>
                  <p class="text-center text-secondary">
                    Silakan login terlebih dahulu untuk masuk ke halaman PeTIKHub
                  </p>
                  <!-- Username -->
                  <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">
                      Username
                    </label>

                    <input type="text" id="username" class="form-control form-control-lg" />

                    <small id="usernameError" class="text-danger d-block"></small>
                  </div>

                  <!-- Password -->
                  <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                      Password
                    </label>

                    <input type="password" id="password" class="form-control form-control-lg" />

                    <small id="passwordError" class="text-danger d-block"></small>
                  </div>

                  <!-- Submit -->

                  <small id="loginError" class="text-danger d-block mt-2" role="alert" aria-live="polite"></small>
                  <button type="submit" class="btn btn-primary fw-bold mt-2 fs-6 btn-lg w-100">
                    Masuk Sekarang
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="Template/assets/js/bootstrap.bundle.min.js"></script>
  <script src="Template/assets/js/main.js"></script>
  <script src="login.js"></script>
</body>

</html>
